{% extends "general/base.html" %}

{% block head %}
	<link rel="stylesheet" href="/jslibs/HTML5-Reset/assets/css/reset.css" />
	<link rel="stylesheet" href="/jslibs/HTML5-Reset/assets/css/style.css" />
  <link rel="stylesheet" href="/css/main.css">

  <!-- canvas -->
  <script type="text/javascript" src="/jslibs/jquery/dist/jquery.min.js"></script>
	<script type="text/javascript" src="/jslibs/CreateJS/createjs.js"></script>
  <script type="text/javascript" src="/jslibs/Box2d/Box2dWeb-2.1.a.3.min.js"></script>
	<script type="text/javascript" src="/js/PlayQueue.js"></script>
{% endblock %}


{% block content %}
  <script>
    window.onload = function() {
    	initCanvas();
    }
  </script>

  <section id="top" class="top" data-page="top" data-fit-window="true">
    {# canvas内部の挙動はworld.jsに，menuやcopyrightなどの設定はsetting.jsに書かれている #}
    <div class="container">
	   <canvas id="canvas" style="background-color: #FFF;" resize></canvas>
    </div>
   	<div class="playmenus" id="ms" style="display:none;opacity:0;position:fixed;">
   		<div class="playmenu" onclick="clickm1()" id="m1" style="color:#000; position:absolute; top:10px; left:20px; cursor:pointer; visibility: hidden;"></div>
   		<div class="playmenu" onclick="clickm2()" id="m2" style="color:#000; position:absolute; top:10px; left:20px; cursor:pointer; visibility: hidden;"></div>
   		<div class="playmenu" onclick="clickm3()" id="m3" style="color:#000; position:absolute; top:180px; left:20px; cursor:pointer;">BIO</div>
   		<div class="playmenu" onclick="clickm4()" id="m4" style="color:#000; position:absolute; top:220px; left:20px; cursor:pointer;">BLOG</div>
   		<div class="playmenu" onclick="clickm5()" id="m5" style="color:#000; position:absolute; top:260px; left:20px; cursor:pointer;">CONTACT</div>
   	</div>
    <div id="copyright" class="copyright" style="position: fixed;">© <script>document.write(new Date().getFullYear());</script> KAZUKI OTSUKA</div>
  </section>
{% endblock %}

{% block foot %}
	<script type="text/javascript" src="/js/conf.js"></script>
	<script type="text/javascript" src="/js/world.js"></script>
	<script type="text/javascript" src="/js/setting.js"></script>
	<script type="text/javascript" src="/js/shuffle.js"></script>
 
  <script src="/js/main.js"></script>
{% endblock %}
